[package]
name = "localmind-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
llama-cpp-4 = { version = "=0.12.0", default-features = false }
tantivy = { version = "0.25", default-features = false, features = ["mmap", "lz4-compression"] }
thiserror = "2"
uniffi = { version = "0.29", default-features = false }
usearch = { version = "2.26", default-features = false }

[dev-dependencies]
tempfile = "3"
