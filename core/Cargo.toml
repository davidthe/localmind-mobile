[package]
name = "localmind-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
blake3 = "1"
thiserror = "2"

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }
